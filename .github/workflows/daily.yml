# Rebuilds the jobs feed every morning and commits it to docs/, which GitHub
# Pages serves at https://bprashant001.github.io/data-nerd-jobs/jobs.json
# (the URL the Data Nerd app downloads). Uses only the built-in GITHUB_TOKEN.
name: Daily jobs feed

on:
  schedule:
    - cron: "30 1 * * *" # 07:00 IST / 02:30 CET / 21:30 ET
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jobs-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml==6.0.2

      - name: Test the rules
        run: python -m unittest discover -s tools/jobs

      - name: Fetch jobs
        env:
          # Optional: free Adzuna keys add broader coverage when present.
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        # Writes docs/jobs.json and docs/history/<date>.json (used for weekly trends).
        run: python tools/jobs/fetch_jobs.py --out docs

      - name: Publish if the feed looks healthy
        run: |
          python - <<'EOF'
          import json, sys
          n = len(json.load(open("docs/jobs.json", encoding="utf-8"))["jobs"])
          print(f"{n} jobs")
          # A near-empty feed means sources broke; fail without committing,
          # so yesterday's file stays live.
          sys.exit(0 if n >= 50 else 1)
          EOF
          # Keep 60 days of skill-share history (files are named by date).
          python -c "import pathlib,datetime as d; c=(d.date.today()-d.timedelta(days=60)).isoformat(); [f.unlink() for f in pathlib.Path('docs/history').glob('*.json') if f.stem < c]"
          touch docs/.nojekyll
          git config user.name "data-nerd-jobs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Jobs feed $(date -u +%Y-%m-%d)" || exit 0
          git push
